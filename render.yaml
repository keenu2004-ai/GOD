services:
  - type: web
    name: theiakshi-one-hrms
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: theiakshi-one-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true

databases:
  - name: theiakshi-one-db
    databaseName: theiakshi_hrms
    user: theiakshi_admin
    plan: free